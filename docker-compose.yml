name: ai-workflow-builder

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: awb
      POSTGRES_PASSWORD: awb
      POSTGRES_DB: awb
    ports:
      - "5433:5432"
    volumes:
      - awb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal bundled dev server (CLI image): server + in-memory store + Web UI on :8233.
  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC (SDK connects here)
      - "8233:8233"   # Temporal Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  awb_pgdata:
