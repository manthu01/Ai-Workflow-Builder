# Single-container variant of deploy/nginx.conf: runs as a non-root user,
# listens on the Space's port, and proxies to the API on loopback.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;

  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 7860;
    server_name _;
    root /app/apps/web/dist;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Live run progress (/api/runs/:id/stream) is Server-Sent Events: no buffering, long-lived.
    location /api/runs/ {
      proxy_pass http://127.0.0.1:8787;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8787;
      client_max_body_size 12m;
    }

    location = /health {
      proxy_pass http://127.0.0.1:8787;
    }

    # Hashed build assets can be cached forever; index.html never.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
