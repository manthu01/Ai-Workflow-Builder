# awb-web: serves the built UI and proxies the API. Caddy (shared proxy) sits
# in front and terminates HTTPS; it sets X-Forwarded-For to the real client,
# which the API's per-IP demo limits read.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # Live run progress (/api/runs/:id/stream) is Server-Sent Events: no buffering, long-lived.
  location /api/runs/ {
    proxy_pass http://api:8787;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8787;
    client_max_body_size 12m;
  }

  location = /health {
    proxy_pass http://api:8787;
  }

  # Hashed build assets can be cached forever; index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
